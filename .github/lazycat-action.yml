version: 1
project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/application.lpk
  target_arch: amd64
update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: crossdesk-server
build:
  toolchains: []
  run_buildscript: false
images:
  - id: crossdesk-server
    target: service
    service: crossdesk-server
    source: crossdesk/crossdesk-server
    channel: stable
    sort: semver
    tag_regex: ^v?[0-9]+[.][0-9]+[.][0-9]+$
    delivery:
      mode: mirror
      require_digest_match: true
  - id: coturn
    target: service
    service: coturn
    source: coturn/coturn
    channel: custom
    sort: semver
    # coturn publishes suffixed tags (4.17.2-r0-debian) that the stable/semver
    # channel cannot resolve. Upstream pins this exact immutable revision, so
    # match only it.
    tag_regex: '^4[.]17[.]2-r0-debian$'
    version_regex: '^(?P<version>4[.]17[.]2)-r0-debian$'
    version_template: '{version}'
    delivery:
      mode: mirror
      require_digest_match: true
release:
  use_github_release_notes: true
  store_changelog_format: plain
stores:
  official:
    enabled: false
  private:
    enabled: false
    name: CrossDesk Server
    skip_if_version_exists: true
